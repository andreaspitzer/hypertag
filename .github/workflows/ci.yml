name: CI

# Test on every push (all branches, including master) and every pull request.
# master runs CI here for a per-commit test signal and a green badge; releasing
# master is handled separately by release.yml.
on:
  pull_request:
  push:

jobs:
  test:
    # Full lint + tests + coverage. The dev toolchain (ava 8, c8) needs a modern
    # Node, so this runs on the versions where it is reliable.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    # Verify the published library loads and works on every Node it supports
    # (engines: >=18). No dev dependencies, just require() and import.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run smoke
