name: CI

# Test on every branch except master (feature branches and pull requests).
# master is handled by release.yml, which runs the same checks before releasing.
on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  test:
    # Full lint + tests + coverage. The dev toolchain (ava 8, c8) needs a modern
    # Node, so this runs on the versions where it is reliable.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    # Verify the published library loads and works on every Node it supports
    # (engines: >=18). No dev dependencies, just require() and import.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run smoke
